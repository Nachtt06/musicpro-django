{% extends 'base.html' %}
{% block title %}Mi Perfil - MusicPro{% endblock %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800"><i class="fas fa-user-circle mr-3"></i>Mi Perfil</h1>
</div>

<div class="grid lg:grid-cols-3 gap-8">
    <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
            <div class="w-32 h-32 bg-gradient-to-br from-purple-500 to-indigo-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-user text-5xl text-white"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">{{ usuario.nombre }}</h2>
            <p class="text-gray-600 mb-4">{{ usuario.email }}</p>
            <span class="inline-block bg-purple-100 text-purple-800 px-4 py-2 rounded-full text-sm font-medium">{{ usuario.rol|title }}</span>
            
            <div class="mt-8 space-y-4">
                <a href="{% url 'historial_compras' %}" class="block w-full bg-purple-600 text-white py-3 px-6 rounded-lg hover:bg-purple-700 transition font-medium">
                    <i class="fas fa-history mr-2"></i>Historial de Compras
                </a>
                <a href="{% url 'catalogo' %}" class="block w-full bg-gray-100 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-200 transition font-medium">
                    <i class="fas fa-store mr-2"></i>Ir al Catálogo
                </a>
            </div>
        </div>
    </div>
    
    <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Información Personal</h2>
            <form class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
                        <input type="text" value="{{ usuario.nombre }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" value="{{ usuario.email }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de Usuario</label>
                    <input type="text" value="{{ usuario.username }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" readonly>
                </div>
                <button type="button" class="bg-purple-600 text-white py-3 px-8 rounded-lg hover:bg-purple-700 transition font-medium">
                    <i class="fas fa-save mr-2"></i>Guardar Cambios
                </button>
            </form>
        </div>
        
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Cambiar Contraseña</h2>
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña Actual</label>
                    <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nueva Contraseña</label>
                        <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar Contraseña</label>
                        <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                    </div>
                </div>
                <button type="button" class="bg-gray-800 text-white py-3 px-8 rounded-lg hover:bg-gray-900 transition font-medium">
                    <i class="fas fa-lock mr-2"></i>Actualizar Contraseña
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
