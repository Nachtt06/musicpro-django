{% extends 'base.html' %}
{% block title %}Orden Confirmada - MusicPro{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto text-center py-12">
    <div class="bg-white rounded-2xl shadow-lg p-12">
        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-5xl text-green-500"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-4">¡Orden Confirmada!</h1>
        <p class="text-gray-600 mb-6">Tu pedido ha sido procesado exitosamente.</p>
        
        <div id="orden-detalle" class="bg-gray-50 rounded-xl p-6 mb-8 text-left">
        </div>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'catalogo' %}" class="bg-purple-600 text-white py-3 px-8 rounded-lg hover:bg-purple-700 transition font-bold">
                <i class="fas fa-store mr-2"></i>Seguir Comprando
            </a>
            <a href="{% url 'perfil' %}" class="bg-gray-100 text-gray-700 py-3 px-8 rounded-lg hover:bg-gray-200 transition font-bold">
                <i class="fas fa-user mr-2"></i>Ver Mi Perfil
            </a>
        </div>
    </div>
</div>

<script>
function cargarOrden() {
    const compra = JSON.parse(localStorage.getItem('ultima_compra'));
    const detalle = document.getElementById('orden-detalle');
    
    if (!compra) {
        detalle.innerHTML = '<p class="text-gray-500">No hay información de la orden</p>';
        return;
    }
    
    const fecha = new Date(compra.fecha).toLocaleString('es-CL');
    const numeroOrden = compra.numero || 'ORD-' + Date.now().toString().slice(-8);
    
    detalle.innerHTML = `
        <div class="flex justify-between mb-4">
            <span class="font-medium text-gray-800">Número de Orden:</span>
            <span class="font-bold text-purple-600">${numeroOrden}</span>
        </div>
        <div class="flex justify-between mb-4">
            <span class="font-medium text-gray-800">Fecha:</span>
            <span>${fecha}</span>
        </div>
        <div class="border-t pt-4 mt-4">
            <p class="font-medium text-gray-800 mb-2">Productos:</p>
            ${compra.productos.map(p => `
                <div class="flex justify-between text-sm mb-1">
                    <span>${p.nombre} x${p.cantidad}</span>
                    <span>$${(p.precio * p.cantidad).toLocaleString()}</span>
                </div>
            `).join('')}
        </div>
        <div class="border-t pt-4 mt-4 flex justify-between text-lg font-bold">
            <span>Total Pagado:</span>
            <span class="text-purple-600">$${compra.total.toLocaleString()}</span>
        </div>
    `;
}

cargarOrden();
</script>
{% endblock %}
