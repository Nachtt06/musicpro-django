{% extends 'base.html' %}
{% block title %}Historial de Compras - MusicPro{% endblock %}
{% block content %}
<div class="mb-8">
    <a href="{% url 'perfil' %}" class="text-purple-600 hover:text-purple-800 font-medium">
        <i class="fas fa-arrow-left mr-2"></i>Volver al perfil
    </a>
    <h1 class="text-3xl font-bold text-gray-800 mt-4"><i class="fas fa-history mr-3"></i>Historial de Compras</h1>
</div>

<div id="historial-vacio" class="bg-white rounded-2xl shadow-lg p-12 text-center hidden">
    <i class="fas fa-shopping-bag text-8xl text-gray-300 mb-6"></i>
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Sin compras anteriores</h2>
    <p class="text-gray-600 mb-6">Aún no has realizado ninguna compra.</p>
    <a href="{% url 'catalogo' %}" class="inline-block bg-purple-600 text-white py-3 px-8 rounded-lg hover:bg-purple-700 transition font-bold">
        <i class="fas fa-store mr-2"></i>Explorar Catálogo
    </a>
</div>

<div id="historial-contenido" class="space-y-6 hidden">
</div>

<script>
function cargarHistorial() {
    const historial = JSON.parse(localStorage.getItem('historial_compras')) || [];
    const vacio = document.getElementById('historial-vacio');
    const contenido = document.getElementById('historial-contenido');
    
    if (historial.length === 0) {
        vacio.classList.remove('hidden');
        contenido.classList.add('hidden');
        return;
    }
    
    vacio.classList.add('hidden');
    contenido.classList.remove('hidden');
    
    contenido.innerHTML = historial.map((compra, index) => `
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div class="p-6 border-b bg-gray-50">
                <div class="flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <p class="font-bold text-gray-800">Orden #${compra.numero}</p>
                        <p class="text-sm text-gray-500">${new Date(compra.fecha).toLocaleString('es-CL')}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">
                            <i class="fas fa-check-circle mr-1"></i>Completada
                        </span>
                        <span class="text-lg font-bold text-purple-600">$${compra.total.toLocaleString()}</span>
                    </div>
                </div>
            </div>
            <div class="p-6">
                <p class="font-medium text-gray-800 mb-3">Productos:</p>
                <div class="space-y-3">
                    ${compra.productos.map(p => `
                        <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg">
                            <img src="${p.imagen}" alt="${p.nombre}" class="w-16 h-16 object-cover rounded-lg">
                            <div class="flex-1">
                                <p class="font-medium text-gray-800">${p.nombre}</p>
                                <p class="text-sm text-gray-500">Cantidad: ${p.cantidad}</p>
                            </div>
                            <p class="font-bold text-purple-600">$${(p.precio * p.cantidad).toLocaleString()}</p>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>
    `).join('');
}

cargarHistorial();
</script>
{% endblock %}
