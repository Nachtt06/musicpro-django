{% extends 'base.html' %}
{% block title %}Crear Cuenta - MusicPro{% endblock %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center gradient-bg py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div>
            <div class="flex justify-center">
                <i class="fas fa-music text-6xl text-white"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-white">MusicPro</h2>
            <p class="mt-2 text-center text-sm text-purple-200">Crea tu cuenta nueva</p>
        </div>
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            {% if error %}
            <div class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
                <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
            </div>
            {% endif %}
            {% if exito %}
            <div class="mb-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg">
                <i class="fas fa-check-circle mr-2"></i>{{ exito }}
            </div>
            {% endif %}
            <form class="space-y-5" method="POST">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Nombre de Usuario</label>
                    <div class="mt-1 relative">
                        <input id="username" name="username" type="text" required class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 sm:text-sm" placeholder="Elige un usuario">
                        <span class="absolute right-3 top-3 text-gray-400"><i class="fas fa-user"></i></span>
                    </div>
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre Completo</label>
                    <div class="mt-1 relative">
                        <input id="nombre" name="nombre" type="text" required class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 sm:text-sm" placeholder="Tu nombre completo">
                        <span class="absolute right-3 top-3 text-gray-400"><i class="fas fa-id-card"></i></span>
                    </div>
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <div class="mt-1 relative">
                        <input id="email" name="email" type="email" required class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 sm:text-sm" placeholder="tu@email.com">
                        <span class="absolute right-3 top-3 text-gray-400"><i class="fas fa-envelope"></i></span>
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <div class="mt-1 relative">
                        <input id="password" name="password" type="password" required minlength="3" class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 sm:text-sm" placeholder="Mínimo 3 caracteres">
                        <span class="absolute right-3 top-3 text-gray-400"><i class="fas fa-lock"></i></span>
                    </div>
                </div>
                <div>
                    <label for="password2" class="block text-sm font-medium text-gray-700">Confirmar Contraseña</label>
                    <div class="mt-1 relative">
                        <input id="password2" name="password2" type="password" required minlength="3" class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 sm:text-sm" placeholder="Repite tu contraseña">
                        <span class="absolute right-3 top-3 text-gray-400"><i class="fas fa-lock"></i></span>
                    </div>
                </div>
                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white gradient-bg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-user-plus text-purple-300 group-hover:text-purple-200"></i>
                        </span>
                        Crear Cuenta
                    </button>
                </div>
            </form>
            <div class="mt-6">
                <div class="text-sm text-center">
                    <a href="{% url 'login' %}" class="font-medium text-purple-600 hover:text-purple-500">
                        <i class="fas fa-sign-in-alt mr-1"></i> Ya tengo una cuenta
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
