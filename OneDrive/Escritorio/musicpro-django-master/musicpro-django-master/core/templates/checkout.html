{% extends 'base.html' %}
{% block title %}Pagar - MusicPro{% endblock %}
{% block content %}
<div class="mb-8">
    <a href="{% url 'carrito' %}" class="text-purple-600 hover:text-purple-800 font-medium">
        <i class="fas fa-arrow-left mr-2"></i>Volver al carrito
    </a>
    <h1 class="text-3xl font-bold text-gray-800 mt-4"><i class="fas fa-credit-card mr-3"></i>Proceder al Pago</h1>
</div>

<div class="grid lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Información de Pago</h2>
            
            <form id="checkout-form" class="space-y-6">
                {% csrf_token %}
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre Completo</label>
                        <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="Juan Pérez">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="correo@ejemplo.com">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dirección de Envío</label>
                    <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="Av. Principal 123">
                </div>
                
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ciudad</label>
                        <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="Santiago">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Código Postal</label>
                        <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="8320000">
                    </div>
                </div>
                
                <div class="border-t pt-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Datos de la Tarjeta</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Número de Tarjeta</label>
                        <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="1234 5678 9012 3456" maxlength="19">
                    </div>
                    <div class="grid grid-cols-2 gap-6 mt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Vencimiento</label>
                            <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="MM/AA" maxlength="5">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">CVV</label>
                            <input type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-purple-600 text-white py-4 px-6 rounded-lg hover:bg-purple-700 transition font-bold text-lg">
                    <i class="fas fa-lock mr-2"></i>Confirmar Pago
                </button>
            </form>
        </div>
    </div>
    
    <div class="lg:col-span-1">
        <div class="bg-white rounded-2xl shadow-lg p-6 sticky top-24">
            <h2 class="text-xl font-bold text-gray-800 mb-6">Tu Pedido</h2>
            <div id="resumen-pedido" class="space-y-4 mb-6 max-h-64 overflow-y-auto">
            </div>
            <div class="border-t pt-4 space-y-2">
                <div class="flex justify-between">
                    <span class="text-gray-600">Subtotal</span>
                    <span id="subtotal" class="font-medium">$0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-600">Envío</span>
                    <span class="text-green-600 font-medium">Gratis</span>
                </div>
                <div class="flex justify-between text-lg font-bold pt-2 border-t">
                    <span>Total</span>
                    <span id="total" class="text-purple-600">$0</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function cargarResumen() {
    const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    const resumen = document.getElementById('resumen-pedido');
    
    resumen.innerHTML = carrito.map(item => `
        <div class="flex gap-3 items-center">
            <img src="${item.imagen}" alt="${item.nombre}" class="w-14 h-14 object-cover rounded-lg">
            <div class="flex-1">
                <p class="font-medium text-gray-800 text-sm">${item.nombre}</p>
                <p class="text-purple-600 font-bold text-sm">$${item.precio.toLocaleString()} x ${item.cantidad}</p>
            </div>
        </div>
    `).join('');
    
    const subtotal = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
    document.getElementById('subtotal').textContent = '$' + subtotal.toLocaleString();
    document.getElementById('total').textContent = '$' + subtotal.toLocaleString();
}

document.getElementById('checkout-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
    if (carrito.length === 0) {
        alert('Tu carrito está vacío');
        return;
    }
    
    const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
    const numeroOrden = 'ORD-' + Date.now().toString().slice(-8);
    
    const compra = {
        numero: numeroOrden,
        productos: carrito,
        fecha: new Date().toISOString(),
        total: total
    };
    
    let historial = JSON.parse(localStorage.getItem('historial_compras')) || [];
    historial.unshift(compra);
    localStorage.setItem('historial_compras', JSON.stringify(historial));
    
    localStorage.setItem('ultima_compra', JSON.stringify(compra));
    
    localStorage.removeItem('carrito');
    window.location.href = '{% url "confirmacion_orden" %}';
});

cargarResumen();
</script>
{% endblock %}
